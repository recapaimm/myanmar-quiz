<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>သိလား? Myanmar Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="brand">
        <div class="logo">🧠</div>

        <div>
          <h1>သိလား?</h1>
          <small>MYANMAR QUIZ</small>
        </div>
      </div>

    </header>


    <!-- Home Hero -->
    <section class="hero">

      <div class="hero-icon">🎯</div>

      <h2>1-Minute Quiz</h2>

      <p>
        ၁ မိနစ်အတွင်း မေးခွန်းတွေကို ဖြေကြည့်ပါ။
        အဖြေမှန်ရင် မှန်ကြောင်း၊ မှားရင် မှားကြောင်း ပြပေးပါမယ်။
      </p>

      <button class="play" onclick="showCategories()">
        ▶ စတင်ကစားမယ်
      </button>

    </section>


    <!-- Category Section -->
    <section id="category-section" class="category-section">

      <div class="section-title">
        <h2>📚 Category ရွေးပါ</h2>
      </div>

      <div id="categories" class="categories"></div>

    </section>


    <!-- Quiz Section -->
    <section id="quiz-section" class="quiz-section">

      <div class="quiz-top">

        <button class="back" onclick="goHome()">
          ←
        </button>

        <div id="question-count" class="question-count">
          Question
        </div>

        <div id="timer" class="timer">
          60
        </div>

      </div>


      <div class="progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>


      <div class="question-card">

        <div id="question-number" class="question-number">
          Question 1
        </div>

        <div id="question" class="question">
          မေးခွန်း
        </div>

      </div>


      <div id="answers" class="answers"></div>

      <div id="quiz-message" class="quiz-message"></div>

      <button id="next-button" class="next" onclick="nextQuestion()">
        နောက်မေးခွန်း →
      </button>

    </section>


    <!-- Finished Screen -->
    <section id="finished-section" class="finished">

      <div class="finished-icon">
        🎉
      </div>

      <h2>Quiz ပြီးပါပြီ!</h2>

      <p>
        ဒီတစ်ခါ Quiz ကစားပေးလို့ ကျေးဇူးတင်ပါတယ်။
      </p>

      <div class="finished-buttons">

        <button onclick="showCategories()" class="again">
          🔄 ထပ်ကစားမယ်
        </button>

        <button onclick="goHome()" class="home">
          🏠 Home
        </button>

      </div>

    </section>


    <footer class="footer">
      သိလား? Myanmar Quiz
    </footer>

  </main>


  <script src="questions.js"></script>
  <script src="app.js"></script>

</body>
</html>
